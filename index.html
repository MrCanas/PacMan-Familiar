<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac-Man Familiar</title>
  </head>
  <body>
    <div class="canvas-wrap">
      <canvas
        id="game"
        width="640"
        height="560"
        tabindex="0"
        aria-label="Juego Pac-Man Familiar"
      ></canvas>
      <div id="dpad" aria-label="Controles táctiles">
        <button data-dir="up" class="dpad-btn dpad-up" aria-label="Arriba">&#9650;</button>
        <button data-dir="left" class="dpad-btn dpad-left" aria-label="Izquierda">&#9664;</button>
        <button data-dir="right" class="dpad-btn dpad-right" aria-label="Derecha">&#9654;</button>
        <button data-dir="down" class="dpad-btn dpad-down" aria-label="Abajo">&#9660;</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
